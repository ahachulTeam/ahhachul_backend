name: PR Test

on:
  pull_request:
    branches:
    - codex/main
    - develop

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Parse combined secrets
        if: ${{ secrets.DEV_API_META_DATA != '' }}
        env:
          DEV_API_META_DATA: ${{ secrets.DEV_API_META_DATA }}
        run: |
          echo "Extracting secrets..."
          while IFS= read -r row; do
            key="$(echo "$row" | jq -r '.key')"
            value="$(echo "$row" | jq -r '.value')"

            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < <(echo "$DEV_API_META_DATA" | jq -c 'to_entries[]')

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Test Kotlin
        run: ./gradlew compileTestKotlin

      - name: Test with Gradle
        run: ./gradlew --info test

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v1
        if: ${{ always() }}
        with:
          files: application/build/test-results/**/*.xml

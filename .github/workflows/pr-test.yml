name: PR Test

on:
  pull_request:
    branches:
    - codex/main
    - develop

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Parse combined secrets
        env:
          DEV_API_META_DATA: ${{ secrets.DEV_API_META_DATA }}
        run: |
          echo "Extracting secrets..."
          if [ -z "$DEV_API_META_DATA" ]; then
            echo "DEV_API_META_DATA is empty. Skip parsing."
            exit 0
          fi

          while IFS= read -r row; do
            key="$(echo "$row" | jq -r '.key')"
            value="$(echo "$row" | jq -r '.value')"

            if [[ "$key" == DOCKER_HOST || "$key" == DOCKER_API_VERSION || "$key" == TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE ]]; then
              echo "Skip unsafe runtime key: $key"
              continue
            fi

            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < <(echo "$DEV_API_META_DATA" | jq -c 'to_entries[]')

      - name: Normalize Docker runtime for Testcontainers
        run: |
          echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
          echo "DOCKER_API_VERSION=1.44" >> "$GITHUB_ENV"
          echo "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock" >> "$GITHUB_ENV"

      - name: Print Docker runtime variables
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST}"
          echo "DOCKER_API_VERSION=${DOCKER_API_VERSION}"
          echo "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=${TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE}"

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Test Kotlin
        run: ./gradlew compileTestKotlin

      - name: Test with Gradle
        run: ./gradlew --info test

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v1
        if: ${{ always() }}
        with:
          files: application/build/test-results/**/*.xml
